apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-api-amer
  labels:
    app.kubernetes.io/name: greeting-api
    app.kubernetes.io/region: amer
    app.kubernetes.io/part-of: global-greeting-platform
    app.kubernetes.io/managed-by: gibbon
  annotations:
    compliance.example.com/data-region: us
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: greeting-api
      app.kubernetes.io/region: amer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greeting-api
        app.kubernetes.io/region: amer
        app.kubernetes.io/part-of: global-greeting-platform
        app.kubernetes.io/managed-by: gibbon
    spec:
      containers:
      - name: greeting-api
        image: ghcr.io/example/greeting-api:1.0.0
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: greeting-api
        - name: DEFAULT_LOCALE
          value: en_US.UTF-8
        - name: LANG
          value: en_US.UTF-8
        - name: SUPPORTED_LOCALES
          value: en_US,es_MX,fr_CA
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
