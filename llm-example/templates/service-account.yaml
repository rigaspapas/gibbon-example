apiVersion: v1
kind: ServiceAccount
metadata:
  name:
    prefix: gibbon-
  namespace: mynamespace
  labels:
    engine:
      prefix: gibbon-
    engine/version: {}
secrets:
- name: gibbon-traffic-manager-token-<token>
spec:
  template:
    spec:
      containers:
      - env:
        - name:
            AGENT_MOUNT_POLICIES:
              '/tmp":': Local
