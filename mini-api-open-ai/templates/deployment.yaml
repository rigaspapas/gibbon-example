# Source: mini-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-api
  labels:
    helm.sh/chart: mini-api-0.1.0
    app.kubernetes.io/name: mini-api
    app.kubernetes.io/instance: mini-api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mini-api
      app.kubernetes.io/instance: mini-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mini-api
        app.kubernetes.io/instance: mini-api
    spec:
      containers:
        - name: mini-api
          image: "ghcr.io/nginxinc/nginx-unprivileged:1.27-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mini-api
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
