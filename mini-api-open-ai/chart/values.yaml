replicaCount: 2

image:
  repository: ghcr.io/nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  greeting: "Hello from mini-api"

podLabels: {}
podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
