apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-gibbon-traffic-manager
  namespace: mynamespace
  ownerReferences:
  - apiVersion: v1
    kind: Namespace
    name: mynamespace
    uid: ''
  - apiVersion: apps/v1
    kind: Deployment
    name: gibbon-gibbon-traffic-manager
    uid: ''
spec:
  selector:
    matchLabels:
      app: gibbon-gibbon-traffic-manager
      telepresence: manager
  template:
    metadata:
      labels:
        app: gibbon-gibbon-traffic-manager
        engine: gibbon
        telepresence: manager
        engine/version: 0.0.1
    spec:
      containers:
      - name: gibbon-gibbon-traffic-manager
        env:
        - name: AGENT_MOUNT_POLICIES
          value: '{"/tmp":"Local"}'
        - name: NOT_USED_NSS
          value: '["kube-system","kube-node-lease"]'
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts: []
        workingDir: /app
      serviceAccount: gibbon-gibbon-traffic-manager
      serviceAccountName: gibbon-gibbon-traffic-manager
